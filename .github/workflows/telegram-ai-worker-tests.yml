name: Telegram AI Worker tests

on:
  push:
    paths:
      - "telegram-ai-worker/**"
      - ".github/workflows/telegram-ai-worker-tests.yml"
  pull_request:
    paths:
      - "telegram-ai-worker/**"
      - ".github/workflows/telegram-ai-worker-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
